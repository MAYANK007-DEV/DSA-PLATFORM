<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients matching the uploaded logo -->
    <linearGradient id="hexLeft" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ff2d75"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>

    <linearGradient id="hexRight" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff2d75"/>
    </linearGradient>

    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c0f0"/>
      <stop offset="50%" stop-color="#b5179e"/>
      <stop offset="100%" stop-color="#ff2d75"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark charcoal/black rounded background container -->
  <rect width="500" height="500" rx="40" fill="#090b10"/>

  <g transform="translate(0, -15)">
    <!-- Outer Hexagon faceted ribbon -->
    <!-- Top-left segment -->
    <path d="M 250 50 L 390 130 L 390 200 L 250 120 L 155 175 L 110 150 Z" 
          fill="url(#hexLeft)" opacity="0.95" />
    
    <!-- Top-right segment -->
    <path d="M 250 50 L 390 130 L 345 155 L 250 100 L 155 155 L 110 130 Z" 
          fill="url(#hexRight)" opacity="0.95" />

    <!-- Bottom-left faceted ribbon -->
    <path d="M 110 150 L 155 175 L 155 270 L 250 325 L 250 380 L 110 300 Z" 
          fill="url(#hexLeft)" />

    <!-- Bottom-right faceted ribbon -->
    <path d="M 390 150 L 390 300 L 250 380 L 250 325 L 345 270 L 345 175 Z" 
          fill="url(#hexRight)" />

    <!-- The inner code glyphs: < / > with vibrant gradient -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- < -->
      <path d="M 205 185 L 140 235 L 205 285" 
            stroke="url(#codeGrad)" stroke-width="26" fill="none" />
      
      <!-- / (slash) -->
      <path d="M 275 160 L 225 310" 
            stroke="#ff2d75" stroke-width="26" fill="none" />
      
      <!-- > -->
      <path d="M 295 185 L 360 235 L 295 285" 
            stroke="#ff2d75" stroke-width="26" fill="none" />
    </g>
  </g>

  <!-- Typography matching exact uploaded logo -->
  <text x="250" y="420" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif, 'Segoe UI', Roboto" 
        font-weight="900" 
        font-size="44" 
        letter-spacing="5" 
        fill="#ff2d75">
    PRACTICE
  </text>
  
  <text x="250" y="465" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif, 'Segoe UI', Roboto" 
        font-weight="700" 
        font-size="24" 
        letter-spacing="12" 
        fill="#ff2d75">
    KIT CODING
  </text>
</svg>
